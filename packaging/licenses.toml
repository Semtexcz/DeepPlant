# The Chromium third-party notice set (Issue #93 review).
#
# Qt WebEngine compiles Chromium into Qt6WebEngineCore, so Chromium's third-party
# licences apply to the distributed binaries too. Upstream does not publish that
# notice set as a single immutable release file: Qt *generates* it at build time
# with Chromium's own tools/licenses/licenses.py (credits mode) through
# qtwebengine/cmake/QtGnCredits.cmake for the GN target :QtWebEngineCore, and
# *publishes* the generated result as the qtwebengine-licensing documentation
# group for the exact Qt release. The `publication` below is that generated set for
# the exact Qt release the distributed wheels are built from.
#
# `bundle` is the static notice text shipped with DeepPlant. It is produced from
# the publication by tools/chromium_notices.py (`generate`), and the packaging
# job re-fetches the publication, verifies `publication_sha256`, and fails unless
# the bundle enumerates *every* component upstream lists (`check`). A partial or
# stale bundle therefore cannot ship.
[chromium]
version = "140.0.7339.264"
source_tag = "v6.11.2"
generator = "Chromium tools/licenses/licenses.py credits via qtwebengine cmake/QtGnCredits.cmake (GN target :QtWebEngineCore)"
publication = "https://doc.qt.io/qt-6.11/qtwebengine-licensing.html"
publication_sha256 = "dc3fc4a73cce79c1070d9b5f752907e629ddb3f1b5b828103a01dbc9ab99d1e7"
components = 126
bundle = "Qt-WebEngine/Chromium-THIRD-PARTY-NOTICES.txt"
