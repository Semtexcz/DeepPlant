# Redistribution compliance payload (Issue #93 review fix).
#
# DeepPlant's Windows installer and Linux AppImage redistribute:
#
#   PySide6 (Qt for Python), the Qt libraries, Qt WebEngine, the
#   QtWebEngineProcess helper, the Chromium engine and its resource/ICU/locale
#   data, and the CPython runtime.
#
# Repository documentation alone is not artifact evidence, so the applicable
# licence and notice texts are staged INTO the installed application. The PySide6
# wheels ship no licence text files at all (verified against the exact 6.11.2
# wheels: only the METADATA `License:` expression is present), so the texts are
# taken from the exact Qt source tag the wheels were built from and are pinned
# here by immutable URL and SHA-256.
#
# This file is the single reviewed source of truth for that payload. It is
# consumed by tools/package_editor.py, which verifies every digest before the
# material is staged, and by tests/test_packaging_licenses.py. Mutable locators
# (latest / continuous / main / master) are forbidden, so the staged material
# always corresponds to the Qt version actually being redistributed.
#
# Bundled application side (project-owned, always present):
#   licenses/README.md                 the compliance mechanism and source offer
#   licenses/CORRESPONDING-SOURCE.md   the corresponding-source mechanism
#   licenses/DEEPLANT-AGPL-3.0.txt     DeepPlant's own licence
#   licenses/THIRD_PARTY_NOTICES.md    the DeepPlant third-party provenance index
#   licenses/Qt-WebEngine/Chromium-THIRD-PARTY-NOTICES.txt
#                                      the generated, version-matched Chromium
#                                      third-party notice set (see [chromium])
#   licenses/Qt-WebEngine/Chromium-NOTICES.md
#                                      how that notice set is generated/verified
schema_version = 1

# Must equal the PySide6 version resolved in uv.lock, and the release tag segment
# of every `url` below. Enforced by tools/package_editor.py and
# tests/test_packaging_licenses.py.
pyside6_version = "6.11.2"
qt_version = "6.11.2"
qt_tag = "v6.11.2"

