schema_version: 1

# Universal bootstrap and invariants only. All other durable context is routed
# from the task, project type, changed paths, or the selected skill.
always:
  - AGENTS.md

task:
  include:
    - project/tasks/{task_id}-*.md

managed:
  include:
    - project/state.yaml
    - project/index.md
    - project/board.md

project_type:
  script:
    - pyproject.toml
    - src/
    - tests/
  library:
    - pyproject.toml
    - src/
    - tests/
  backend:
    - backend/pyproject.toml
    - backend/src/app/main.py
    - backend/tests/
  frontend:
    - frontend/package.json
    - frontend/nuxt.config.ts
    - frontend/pages/
    - frontend/tests/
  fullstack:
    - backend/pyproject.toml
    - backend/src/app/main.py
    - backend/tests/
    - frontend/package.json
    - frontend/nuxt.config.ts
    - frontend/pages/
    - frontend/tests/
    - artifacts/openapi.json
    - frontend/shared/api/
  fullstack-production:
    - compose.yaml
    - backend/Dockerfile
    - frontend/Dockerfile

change_patterns:
  "src/**/*.py":
    - pyproject.toml
    - tests/
    - docs/dev/architecture/index.md
    - docs/contracts/index.md
    - docs/dev/workflow/quality.md
  "tests/**/*.py":
    - pyproject.toml
    - src/
    - docs/dev/architecture/index.md
    - docs/contracts/index.md
    - docs/dev/workflow/quality.md
  "src/deepplant/render.py":
    - docs/contracts/rendering.md
    - docs/dev/reference/svg-symbols.md
  "src/deepplant/assets/symbols/**":
    - docs/dev/reference/svg-symbols.md
  "src/deepplant/adapters/dexpi.py":
    - docs/dev/reference/dexpi-process-adapter.md
  "tests/test_dexpi_adapter.py":
    - docs/dev/reference/dexpi-process-adapter.md
  "tests/test_svg_symbols.py":
    - docs/dev/reference/svg-symbols.md
  "tests/test_render.py":
    - docs/contracts/rendering.md
    - docs/dev/reference/svg-symbols.md
  "backend/**/*.py":
    - docs/dev/architecture/index.md
    - docs/dev/workflow/quality.md
    - backend/tests/
  "frontend/**/*":
    - docs/dev/workflow/quality.md
    - frontend/tests/
  "artifacts/openapi.json":
    - backend/src/app/main.py
    - frontend/shared/api/
  "project/**":
    - project/brief.md
    - docs/roadmap.md
    - docs/planning.md
  "docs/**":
    - docs/index.md
    - docs/dev/index.md
    - docs/dev/workflow/conventions.md
    - docs/dev/workflow/documentation-migration.md
  "docs/dev/architecture/index.md":
    - docs/contracts/index.md
    - docs/decisions/index.md
  "docs/dev/workflow/index.md":
    - docs/dev/workflow/quality.md
    - docs/planning.md
  "docs/dev/workflow/quality.md":
    - docs/dev/workflow/index.md
  "docs/roadmap.md":
    - docs/dev/architecture/index.md
    - docs/planning.md
    - docs/direction.md
  "docs/decisions/**":
    - docs/dev/architecture/index.md
    - docs/decisions/index.md
  ".agents/**":
    - .agents/README.md
    - docs/dev/index.md
  "AGENTS.md":
    - .agents/context-map.yaml
    - docs/dev/index.md
  "**/Dockerfile":
    - docs/dev/architecture/index.md

checks:
  "src/**/*.py":
    - make test
  "tests/**/*.py":
    - make test
  "backend/**/*.py":
    - make test
  "frontend/**/*":
    - make test
  "artifacts/openapi.json":
    - make api-check
  "project/**":
    - make validate-docs
  "docs/**":
    - make validate-docs
  ".agents/**":
    - make validate-agent-skills
  ".codex/**":
    - make validate-agent-skills
  "**/Dockerfile":
    - make image-build

exclude:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/credentials*"
  - "**/secrets*"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/dist/**"
  - "**/.output/**"
  - "**/coverage/**"
  - "**/cache/**"
