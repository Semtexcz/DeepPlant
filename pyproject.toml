[project]
name = "deepplant"
version = "0.1.0"
description = "DeepPlant - Git-native semantic engineering for process plants"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",

  "pyyaml>=6.0.2",

  "typer>=0.16.0",

]

# The editor HTTP transport is the only part of DeepPlant that needs FastAPI and
# Uvicorn. They are an explicit extra so the semantic Core and the ordinary CLI
# stay installable and usable without an editor transport (Issue #85). The
# standalone Editor distribution always contains them; `deepplant ui` and
# `deepplant-editor` report a supported installation instead of an ImportError
# traceback when the extra is absent.
[project.optional-dependencies]
editor = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

# The standalone desktop Editor host (Issue #93). It adds the native window and
# the embedded webview on top of the editor transport. PySide6 is chosen because
# it ships the Qt WebEngine (Chromium) runtime itself, so the packaged
# application needs no separately installed system webview. Like the `editor`
# extra, this is never a dependency of the semantic Core, and it is deliberately
# *not* part of `dev`: the fast `check` gate must stay free of the multi-hundred
# megabyte Qt download.
desktop = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "PySide6>=6.9",
]

[dependency-groups]
# ``editor`` is repeated as a group (not only as an extra) because uv installs
# dependency groups for a source checkout, while ``deepplant[editor]`` is the
# end-user/PyPI spelling of the same requirement set. Keep the two in step.
editor = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

# Mirrors the `desktop` extra. Installed only by the native packaging jobs
# (`uv sync --group package --group desktop`), never by `make setup`.
desktop = [
  { include-group = "editor" },
  "PySide6>=6.9",
]

dev = [
  { include-group = "editor" },
  "httpx2>=2",
  "pytest>=8.3",

  "pytest-cov>=6.0",
  "ruff>=0.12",
  "pyright>=1.1",

]

# Build-only: assembles the standalone Editor distribution. Never a runtime
# dependency of the installed application (see docs/dev/workflow/packaging.md).
package = [
  "pyinstaller>=6.16",
]


[project.scripts]
deepplant = "deepplant.__main__:main"
# The standalone Editor is the native desktop host (Issue #93), not the general
# DeepPlant CLI and not the developer browser host (`deepplant ui`).
deepplant-editor = "deepplant.editor.desktop:main"


[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepplant"]
# The built SPA is owned by the standalone Editor packaging stage, which maps it
# into the frozen application bundle. It is deliberately never part of the base
# Python wheel, even if a developer has staged a copy in the source tree.
exclude = ["/src/deepplant/editor/dist"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "tools"]
# `desktop_qt.py` imports PySide6, which is deliberately *not* part of the `dev`
# environment: the fast `check` gate must not download the multi-hundred megabyte
# Qt runtime, and the semantic Core/CLI/browser host must stay provably free of
# it. Without PySide6 installed, Pyright cannot resolve its stubs, so the file is
# excluded from the default run instead of being silenced with blanket
# suppressions. It is linted by Ruff like every other module and is exercised for
# real by the native `editor-package-windows` / `editor-package-linux` jobs, which
# install the `desktop` group. Those jobs also run the *desktop-specific* strict
# check `pyrightconfig.desktop.json` (via `make typecheck-desktop`), which mirrors
# this strict configuration but keeps `desktop_qt.py` in scope (Issue #93 review).
# See docs/dev/workflow/packaging.md.
exclude = ["src/deepplant/editor/desktop_qt.py"]
