[project]
name = "deepplant"
version = "0.1.0"
description = "DeepPlant - Git-native semantic engineering for process plants"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",

  "pyyaml>=6.0.2",

  "typer>=0.16.0",

]

[dependency-groups]
dev = [
  "pytest>=8.3",

  "pytest-cov>=6.0",
  "ruff>=0.12",
  "pyright>=1.1",

]




[project.scripts]
deepplant = "deepplant.__main__:main"


[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepplant"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "tools"]
