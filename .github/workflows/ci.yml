name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Validation is proportional to the changed surface: a documentation-only pull
# request must not build an installer or download Chromium. Which jobs run is
# decided by a repository-owned, unit-tested classifier (`tools/ci_changes.py`),
# not by workflow `paths:` filters, so the required result never disappears and
# never stays pending. `main`, `workflow_dispatch`, and any build/CI tooling
# change keep the full matrix. See docs/dev/workflow/quality.md.
#
# A superseded pull-request run is cancelled when a new revision is pushed, so
# reviewers only ever wait for the newest commit. `main` and manual runs are
# never cancelled by this rule, so a full-confidence lifecycle run completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ---------------------------------------------------------------------------
  # Change classification. Runs for every event so the routing decision and its
  # evidence are always visible in the log and the workflow summary.
  # ---------------------------------------------------------------------------
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      agents: ${{ steps.classify.outputs.agents }}
      python: ${{ steps.classify.outputs.python }}
      distribution: ${{ steps.classify.outputs.distribution }}
      frontend: ${{ steps.classify.outputs.frontend }}
      e2e: ${{ steps.classify.outputs.e2e }}
      package: ${{ steps.classify.outputs.package }}
      required-jobs: ${{ steps.classify.outputs.required-jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull-request classification diffs against the merge base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify the changed surface
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
            echo "changed files between ${merge_base} and ${HEAD_SHA}:"
            # Discovery lives in the tested classifier so a rename/move keeps both
            # its removed and added path instead of losing the surface it left.
            python tools/ci_changes.py changed-paths "${merge_base}" "${HEAD_SHA}" | tee changed-files.txt
            python tools/ci_changes.py classify --event pull_request --paths-file changed-files.txt
          else
            echo "event '${EVENT_NAME}' selects the full validation matrix"
            python tools/ci_changes.py classify --event "${EVENT_NAME}"
          fi


  require-pr-for-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require main commits to come from a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          count="$(python -c 'import json, sys; print(len(json.load(sys.stdin)))' <<< "${response}")"
          if [ "${count}" -eq 0 ]; then
            echo "Pushes to main must come from a GitHub pull request. Create a branch, push it, and open a ready PR instead."
            exit 1
          fi


  docs-validation:
    # Documentation and agent/context metadata only. Deliberately no Python
    # dependency install, Node, browser, or packaging toolchain: a
    # documentation-only pull request must not install runtime dependencies it
    # cannot use.
    needs: classify-changes
    if: >-
      needs.classify-changes.outputs.docs == 'true' ||
      needs.classify-changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate documentation
        if: needs.classify-changes.outputs.docs == 'true'
        run: make validate-docs

      - name: Validate agent skills and context metadata
        if: needs.classify-changes.outputs.agents == 'true'
        run: make validate-agent-skills


  python-checks:
    # Python/Core confidence: formatting, lint, strict type checking, and the
    # full pytest suite. CI never reduces the full Python suite to save time.
    needs: classify-changes
    if: needs.classify-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: make setup

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Check Python architecture
        run: make architecture-check


  wheel-verification:
    # Python distribution boundary only: build the wheel and prove the packaged
    # runtime resources and the base-installation independence contract. Not run
    # for changes that cannot affect the Python distribution.
    needs: classify-changes
    if: needs.classify-changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: make setup

      - name: Build wheel
        run: uv build

      - name: Verify wheel runtime resources
        run: python tools/verify_wheel_contents.py dist/deepplant-*.whl

      - name: Verify the base installation keeps the Core independent
        run: uv run python tools/verify_base_install.py dist/deepplant-*.whl


  frontend-checks:
    # Frontend source/config changes. This is where the shipped SPA bundle is
    # guaranteed to build in CI: `frontend-build` is deliberately outside the
    # local `make check` gate, so change-aware routing must not lose it.
    needs: classify-changes
    if: needs.classify-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Frontend gate (lint, type check, tests)
        run: make frontend-check

      - name: Build the production SPA bundle
        run: make frontend-build


  frontend-e2e:
    # Real-browser system gate: production SPA build + real `deepplant ui` CLI +
    # real Chromium. Kept as its own job so an E2E failure is distinguishable
    # from the fast frontend gate, and so the fast gate never downloads a
    # browser. Runs only when the change can affect the editor/browser workflow.
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: make setup

      - name: Install frontend dependencies from the frozen lockfile
        run: make frontend-install

      - name: Install Chromium for Playwright
        run: cd apps/editor && pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E (production build + real CLI + Chromium)
        run: make frontend-e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/editor/test-results/
            apps/editor/playwright-report/
          retention-days: 7
          if-no-files-found: ignore


  editor-package-windows:
    # Native Windows distribution gate (Issue #85): build the standalone Editor
    # on the OS it targets, produce a real installer, and verify the installed
    # application outside the repository. Kept out of `check` because packaging
    # is slow and platform-specific, and routed so it runs only for changes that
    # can affect the packaged desktop product.
    needs: classify-changes
    if: needs.classify-changes.outputs.package == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install build dependencies
        run: uv sync --group package --group desktop

      - name: Read the pinned packaging toolchain
        run: python tools/packaging_toolchain.py export

      - name: Strict type-check the Qt desktop host
        # The fast `check` gate excludes the src/deepplant/editor/desktop_qt/ package because
        # it deliberately does not install PySide6. This job does, so the actual Qt
        # module is type-checked in strict mode here (Issue #93 review).
        run: uv run --group dev --group desktop pyright --project pyrightconfig.desktop.json

      - name: Install the pinned Inno Setup (build-time tool only)
        shell: pwsh
        run: |
          choco install innosetup --version $env:INNO_SETUP_VERSION --no-progress -y

      - name: Verify the pinned Inno Setup installation
        shell: pwsh
        run: |
          $expected = $env:INNO_SETUP_VERSION

          # 1. Chocolatey's own record of the installed package version. This is
          #    what "the requested version was installed" means, so a silent
          #    fallback to another installed Inno Setup cannot pass.
          $record = choco list --local-only --exact innosetup --limit-output |
            Where-Object { $_ -match '^innosetup\|' } | Select-Object -First 1
          if (-not $record) {
            throw "Chocolatey does not report an installed 'innosetup' package."
          }
          $packageVersion = ($record -split '\|', 2)[1].Trim()
          Write-Host "Chocolatey innosetup package version: $packageVersion"
          if ($packageVersion -ne $expected) {
            throw "Inno Setup version mismatch: requested $expected, Chocolatey reports '$packageVersion'."
          }

          # 2. Resolve the compiler. The Inno Setup 6 install directory is
          #    preferred over PATH, because a PATH entry may be a Chocolatey shim
          #    rather than the compiler itself.
          $candidates = @()
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if ($programFilesX86) { $candidates += Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe' }
          $candidates += Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup $expected was requested, but ISCC.exe was not found on this runner."
          }

          # 3. ISCC.exe cannot report its own version: its VERSIONINFO resource is
          #    deliberately 0.0.0.0 and Inno Setup 6.7.1 has no `--version`
          #    option. The version that actually built the artifact is asserted
          #    from ISCC's own compiler-engine banner immediately after the build,
          #    before anything is uploaded.
          Write-Host "Inno Setup compiler: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, package and verify the standalone Editor
        shell: pwsh
        run: |
          uv run --group package --group desktop python tools/package_editor.py all *>&1 | Tee-Object -FilePath packaging.log

      - name: Verify the compiler engine version ISCC reported
        shell: pwsh
        run: |
          $expected = $env:INNO_SETUP_VERSION

          # ISCC prints "Compiler engine version: <title> <version>" when it
          # compiles, so the packaging log records the version of the compiler
          # engine that actually built this installer.
          $line = (Select-String -Path packaging.log -Pattern 'Compiler engine version:' |
            Select-Object -First 1).Line
          if (-not $line) {
            throw "ISCC did not report a 'Compiler engine version:' line while building the installer."
          }
          Write-Host "ISCC reported: $line"
          $detected = [regex]::Match($line, '\d+(\.\d+)+').Value
          if ($detected -ne $expected) {
            throw "Inno Setup version mismatch: expected $expected, ISCC reported '$detected'."
          }
          Write-Host "Inno Setup $detected was the compiler engine that built this installer."

      - name: Write artifact checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/editor/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" |
              Set-Content -Path "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-windows-log
          path: |
            packaging.log
            build/editor-package/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Windows desktop verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-windows-desktop-evidence
          path: |
            build/editor-package/verify/reports/*
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Windows Editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepplant-editor-windows
          path: |
            dist/editor/*.exe
            dist/editor/*.exe.sha256
          retention-days: 14
          if-no-files-found: error


  editor-package-linux:
    # Native Linux distribution gate (Issue #85/#93): the AppImage is built and
    # verified on Linux. The product is a native desktop application, so the
    # evidence is the real GUI: the packaging driver's desktop self-check runs
    # inside `verify`, and an explicit window-discovery step below proves a real
    # X11 window appears and closes on a virtual display.
    #
    # The image is pinned because the job owns a *reviewable* Linux runtime
    # baseline: `packaging/linux-runtime-baseline.toml` records the exact host
    # SONAMEs the packaged application may resolve, and the dependency audit fails
    # when an undeclared host library appears. A floating `ubuntu-latest` label
    # would silently move that baseline. (Issue #93 review)
    #
    # Routed like the Windows job: it runs only for changes that can affect the
    # packaged desktop product.
    needs: classify-changes
    if: needs.classify-changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the display and Qt WebEngine runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          # The application bundles its own Python, Qt, and Qt WebEngine/Chromium,
          # so it needs no separately installed Python, Qt, webview, or browser.
          # It *does* use the ordinary Linux desktop graphics/session libraries
          # that any Qt application uses - that is the host-OS half of the
          # supported baseline documented in docs/dev/workflow/packaging.md
          # ("Supported Linux baseline"). The `lib*` packages below are that host
          # userspace, installed so a real graphical session is emulated; the
          # display/automation tools (xvfb, xdotool, x11-utils, openbox, wmctrl)
          # are the CI harness only and are never end-user prerequisites.
          #
          # The canonical, machine-readable record of what this job is allowed to
          # resolve from the host is `packaging/linux-runtime-baseline.toml`. The
          # dependency audit fails if the packaged application resolves a host
          # library that file does not declare, and this install list must provide
          # everything it declares. (Issue #93 review)
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-utils openbox wmctrl \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcursor1 \
            libxi6 libxrender1 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxshmfence1 libgbm1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          # Ubuntu renamed the ALSA runtime package; accept either name.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Start a virtual display for the desktop verification
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1600x1000x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 > /dev/null 2>&1; then break; fi
            sleep 1
          done
          # A window manager is part of a normal desktop: without one, X clients
          # that ask to be closed through the EWMH protocol (which is what
          # `xdotool windowclose` sends) have nobody to deliver the request.
          # openbox makes the virtual display behave like an ordinary session, so
          # the window-close assertion below tests the real application behaviour.
          openbox --sm-disable > "$RUNNER_TEMP/openbox.log" 2>&1 &
          for _ in $(seq 1 30); do
            if pgrep -x openbox > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "openbox processes: $(pgrep -a openbox || echo none)"
          echo "window manager: $(xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null || echo 'not reported')"
          cat "$RUNNER_TEMP/openbox.log"

      - name: Install build dependencies
        run: uv sync --group package --group desktop

      - name: Read the pinned packaging toolchain
        run: python tools/packaging_toolchain.py export

      - name: Strict type-check the Qt desktop host
        # The fast `check` gate excludes the src/deepplant/editor/desktop_qt/ package because
        # it deliberately does not install PySide6. This job does, so the actual Qt
        # module is type-checked in strict mode here (Issue #93 review).
        run: uv run --group dev --group desktop pyright --project pyrightconfig.desktop.json

      - name: Install pinned, integrity-verified appimagetool and AppImage runtime
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          runtime="$RUNNER_TEMP/appimage-runtime"

          # Immutable upstream artifacts, declared in
          # packaging/toolchain.toml. The digest is checked before either file
          # is made executable, so a mismatch aborts the job here and no
          # artifact can be produced with an unexpected toolchain.
          curl -fsSL -o "$tool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum --check -

          curl -fsSL -o "$runtime" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGE_RUNTIME_SHA256  $runtime" | sha256sum --check -

          chmod +x "$tool" "$runtime"

          echo "appimagetool release:             $APPIMAGETOOL_VERSION"
          echo "appimagetool sha256 verified:     $APPIMAGETOOL_SHA256"
          echo "AppImage runtime release:         $APPIMAGE_RUNTIME_VERSION"
          echo "AppImage runtime sha256 verified: $APPIMAGE_RUNTIME_SHA256"
          "$tool" --version

          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Build, package and verify the standalone desktop Editor
        run: |
          uv run --group package --group desktop python tools/package_editor.py all 2>&1 | tee packaging.log

      - name: Write artifact checksum
        run: |
          cd dist/editor
          for artifact in *.AppImage; do
            sha256sum "$artifact" > "$artifact.sha256"
          done

      - name: Discover the real packaged window on the virtual display
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editor-window"
          launcher="$(uv run --group package --group desktop python tools/package_editor.py extract \
            --extract-to "$RUNNER_TEMP/editor-window/install" | tail -n 1)"
          echo "packaged launcher: $launcher"
          test -x "$launcher"

          # Launch exactly as an end user does: with NO model argument. This must
          # open a graphical window, never demand a path or print help.
          "$launcher" > "$RUNNER_TEMP/editor-window/app.log" 2>&1 &
          app_pid=$!

          found=0
          for _ in $(seq 1 90); do
            if xdotool search --name "DeepPlant Editor" > /dev/null 2>&1; then
              found=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$found" -ne 1 ]; then
            echo "FAILED: no DeepPlant Editor window appeared on the virtual display"
            cat "$RUNNER_TEMP/editor-window/app.log" || true
            kill "$app_pid" 2>/dev/null || true
            exit 1
          fi

          echo "window(s) discovered:"
          for wid in $(xdotool search --name "DeepPlant Editor"); do
            echo "  $wid  $(xdotool getwindowname "$wid")"
          done

          # Prove the application exits when its window is closed, using only a
          # real user/session close request (never a signal and never a kill).
          #
          # `xdotool windowclose` is NOT usable here: it destroys the X window out
          # of band, which leaves the client's event loop running with no window -
          # neither an ordinary user action nor a session close request. The
          # canonical EWMH close request is `_NET_CLOSE_WINDOW` (wmctrl -c), which
          # the session window manager turns into WM_DELETE_WINDOW for the client;
          # the ordinary keyboard gesture through the window manager is alt+F4
          # delivered by XTest (indistinguishable from real input).
          wait_for_exit() {
            local deadline=$1
            for _ in $(seq 1 "$deadline"); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          request_session_close() {
            if command -v wmctrl > /dev/null 2>&1; then
              wmctrl -c "DeepPlant Editor" || true
            fi
            for wid in $(xdotool search --name "DeepPlant Editor"); do
              xdotool windowactivate --sync "$wid" 2>/dev/null || true
              xdotool key --clearmodifiers alt+F4 || true
            done
          }

          request_session_close
          wait_for_exit 30 || true
          if xdotool search --name "DeepPlant Editor" > /dev/null 2>&1; then
            # The session may not have delivered the first request; ask once more
            # before treating it as a product failure.
            request_session_close
            wait_for_exit 30 || true
          fi

          # Hard gate 1: the session close request must actually close the window.
          if xdotool search --name "DeepPlant Editor" > /dev/null 2>&1; then
            echo "FAILED: the session close request did not close the Editor window"
            echo "--- diagnostics ---"
            echo "remaining windows:"
            xdotool search --name "DeepPlant Editor" 2>/dev/null | while read -r wid; do
              echo "  $wid $(xdotool getwindowname "$wid" 2>/dev/null)"
            done || true
            pkill -f "$RUNNER_TEMP/editor-window/install" 2>/dev/null || true
            kill "$app_pid" 2>/dev/null || true
            exit 1
          fi
          echo "the session close request closed the real DeepPlant Editor window"

          # Hard gate (Issue #93 review): a window that disappears while the
          # process stays alive is a FAILURE. There is no "window closed but the
          # process lingers" NOTE path any more - forced cleanup runs only after
          # the failure has been recorded, never as the reason the step passed.
          if kill -0 "$app_pid" 2>/dev/null; then
            echo "FAILED: the DeepPlant Editor window closed but the process is still alive"
            echo "--- diagnostics ---"
            echo "window manager: $(xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null)"
            echo "openbox: $(pgrep -a openbox || echo none)"
            echo "remaining application processes:"
            pgrep -af "$RUNNER_TEMP/editor-window/install" || echo "  none"
            echo "remaining web engine helpers:"
            pgrep -af QtWebEngineProcess || echo "  none"
            echo "remaining windows:"
            xdotool search --name "DeepPlant Editor" 2>/dev/null | while read -r wid; do
              echo "  $wid $(xdotool getwindowname "$wid" 2>/dev/null)"
            done || true
            echo "--- application log ---"
            cat "$RUNNER_TEMP/editor-window/app.log" || true
            # Record the failure first, then leave the runner clean.
            pkill -f "$RUNNER_TEMP/editor-window/install" 2>/dev/null || true
            kill "$app_pid" 2>/dev/null || true
            exit 1
          fi

          # No owned application process may remain either.
          if pgrep -f "$RUNNER_TEMP/editor-window/install" > /dev/null 2>&1; then
            echo "FAILED: an application-owned process remains after the main process exited"
            pgrep -af "$RUNNER_TEMP/editor-window/install" || true
            pkill -f "$RUNNER_TEMP/editor-window/install" 2>/dev/null || true
            exit 1
          fi

          echo "WINDOW LIFECYCLE VERIFIED: the packaged application opened a real"
          echo "window with no model argument and the whole process exited when the"
          echo "session closed it - no signal and no kill were used."

      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-linux-log
          path: |
            packaging.log
            build/editor-package/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Linux desktop verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-linux-desktop-evidence
          path: |
            build/editor-package/verify/reports/*
            build/editor-package/verify/dependency-inventory.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Linux Editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepplant-editor-linux
          path: |
            dist/editor/*.AppImage
            dist/editor/*.AppImage.sha256
          retention-days: 14
          if-no-files-found: error


  # ---------------------------------------------------------------------------
  # The stable, always-present aggregate result. This is the single required
  # status check a branch-protection rule should require: it exists on every
  # pull request (no workflow-level `paths:` filter can make it disappear, so it
  # can never stay pending), and it fails closed. It passes only when every job
  # the classifier selected for this change succeeded - a required job that
  # failed, was cancelled, or never ran fails the gate. Jobs the classifier did
  # not select must be `skipped`; a skipped job can never mask a failure.
  # ---------------------------------------------------------------------------
  ci-gate:
    if: always()
    needs:
      - require-pr-for-main
      - classify-changes
      - docs-validation
      - python-checks
      - wheel-verification
      - frontend-checks
      - frontend-e2e
      - editor-package-windows
      - editor-package-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce the change-aware CI gate
        env:
          REQUIRED_JOBS: ${{ needs.classify-changes.outputs.required-jobs }}
          ENFORCE_PR_GUARD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          RESULTS: |
            classify-changes=${{ needs.classify-changes.result }}
            require-pr-for-main=${{ needs.require-pr-for-main.result }}
            docs-validation=${{ needs.docs-validation.result }}
            python-checks=${{ needs.python-checks.result }}
            wheel-verification=${{ needs.wheel-verification.result }}
            frontend-checks=${{ needs.frontend-checks.result }}
            frontend-e2e=${{ needs.frontend-e2e.result }}
            editor-package-windows=${{ needs.editor-package-windows.result }}
            editor-package-linux=${{ needs.editor-package-linux.result }}
        run: python tools/ci_changes.py gate

