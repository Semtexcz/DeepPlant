name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  require-pr-for-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require main commits to come from a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          count="$(python -c 'import json, sys; print(len(json.load(sys.stdin)))' <<< "${response}")"
          if [ "${count}" -eq 0 ]; then
            echo "Pushes to main must come from a GitHub pull request. Create a branch, push it, and open a ready PR instead."
            exit 1
          fi


  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies

        run: make setup

      - name: Check
        run: make check

      - name: Build wheel
        run: uv build

      - name: Verify wheel runtime resources
        run: python tools/verify_wheel_contents.py dist/deepplant-*.whl

      - name: Verify the base installation keeps the Core independent
        run: uv run python tools/verify_base_install.py dist/deepplant-*.whl


  frontend-e2e:
    # Real-browser system gate: production SPA build + real `deepplant ui` CLI +
    # real Chromium. Kept as its own job so an E2E failure is distinguishable
    # from the fast `check` job, and so the default gate never downloads a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: make setup

      - name: Install frontend dependencies from the frozen lockfile
        run: make frontend-install

      - name: Install Chromium for Playwright
        run: cd apps/editor && pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E (production build + real CLI + Chromium)
        run: make frontend-e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/editor/test-results/
            apps/editor/playwright-report/
          retention-days: 7
          if-no-files-found: ignore


  editor-package-windows:
    # Native Windows distribution gate (Issue #85): build the standalone Editor
    # on the OS it targets, produce a real installer, and verify the installed
    # application outside the repository. Kept out of `check` because packaging
    # is slow and platform-specific.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install build dependencies
        run: uv sync --group package

      - name: Install Inno Setup (build-time tool only)
        run: choco install innosetup --no-progress -y

      - name: Build, package and verify the standalone Editor
        shell: pwsh
        run: |
          uv run --group package python tools/package_editor.py all *>&1 | Tee-Object -FilePath packaging.log

      - name: Write artifact checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/editor/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" |
              Set-Content -Path "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-windows-log
          path: |
            packaging.log
            build/editor-package/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Windows Editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepplant-editor-windows
          path: |
            dist/editor/*.exe
            dist/editor/*.exe.sha256
          retention-days: 14
          if-no-files-found: error


  editor-package-linux:
    # Native Linux distribution gate (Issue #85): AppImage built and verified on
    # Linux, plus one real-browser workflow against the packaged application
    # rather than the source CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install build dependencies
        run: uv sync --group package

      - name: Install appimagetool (build-time tool only)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Build, package and verify the standalone Editor
        run: |
          uv run --group package python tools/package_editor.py all 2>&1 | tee packaging.log

      - name: Write artifact checksum
        run: |
          cd dist/editor
          for artifact in *.AppImage; do
            sha256sum "$artifact" > "$artifact.sha256"
          done

      - name: Install Chromium for the packaged-application E2E
        run: cd apps/editor && pnpm exec playwright install --with-deps chromium

      - name: Prepare the packaged application outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/editor-e2e/model"
          cp examples/realistic-process-fragment/plant.yaml \
            "$RUNNER_TEMP/editor-e2e/model/plant.yaml"
          uv run --group package python tools/package_editor.py extract \
            --extract-to "$RUNNER_TEMP/editor-e2e/install"
          echo "DEEPLANT_EDITOR_EXECUTABLE=$RUNNER_TEMP/editor-e2e/install/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "DEEPLANT_EDITOR_PROJECT=$RUNNER_TEMP/editor-e2e/model/plant.yaml" >> "$GITHUB_ENV"

      - name: Run the browser E2E against the packaged application
        run: |
          cd apps/editor
          pnpm run e2e

      - name: Upload packaged-application E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-packaged-e2e-failure-artifacts
          path: |
            apps/editor/test-results/
            apps/editor/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-linux-log
          path: packaging.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Linux Editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepplant-editor-linux
          path: |
            dist/editor/*.AppImage
            dist/editor/*.AppImage.sha256
          retention-days: 14
          if-no-files-found: error

