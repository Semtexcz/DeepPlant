name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  require-pr-for-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require main commits to come from a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          count="$(python -c 'import json, sys; print(len(json.load(sys.stdin)))' <<< "${response}")"
          if [ "${count}" -eq 0 ]; then
            echo "Pushes to main must come from a GitHub pull request. Create a branch, push it, and open a ready PR instead."
            exit 1
          fi


  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies

        run: make setup

      - name: Check
        run: make check

      - name: Build wheel
        run: uv build

      - name: Verify wheel runtime resources
        run: python tools/verify_wheel_contents.py dist/deepplant-*.whl

      - name: Verify the base installation keeps the Core independent
        run: uv run python tools/verify_base_install.py dist/deepplant-*.whl


  frontend-e2e:
    # Real-browser system gate: production SPA build + real `deepplant ui` CLI +
    # real Chromium. Kept as its own job so an E2E failure is distinguishable
    # from the fast `check` job, and so the default gate never downloads a browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: make setup

      - name: Install frontend dependencies from the frozen lockfile
        run: make frontend-install

      - name: Install Chromium for Playwright
        run: cd apps/editor && pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E (production build + real CLI + Chromium)
        run: make frontend-e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/editor/test-results/
            apps/editor/playwright-report/
          retention-days: 7
          if-no-files-found: ignore


  editor-package-windows:
    # Native Windows distribution gate (Issue #85): build the standalone Editor
    # on the OS it targets, produce a real installer, and verify the installed
    # application outside the repository. Kept out of `check` because packaging
    # is slow and platform-specific.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install build dependencies
        run: uv sync --group package --group desktop

      - name: Read the pinned packaging toolchain
        run: python tools/packaging_toolchain.py export

      - name: Install the pinned Inno Setup (build-time tool only)
        shell: pwsh
        run: |
          choco install innosetup --version $env:INNO_SETUP_VERSION --no-progress -y

      - name: Verify the pinned Inno Setup installation
        shell: pwsh
        run: |
          $expected = $env:INNO_SETUP_VERSION

          # 1. Chocolatey's own record of the installed package version. This is
          #    what "the requested version was installed" means, so a silent
          #    fallback to another installed Inno Setup cannot pass.
          $record = choco list --local-only --exact innosetup --limit-output |
            Where-Object { $_ -match '^innosetup\|' } | Select-Object -First 1
          if (-not $record) {
            throw "Chocolatey does not report an installed 'innosetup' package."
          }
          $packageVersion = ($record -split '\|', 2)[1].Trim()
          Write-Host "Chocolatey innosetup package version: $packageVersion"
          if ($packageVersion -ne $expected) {
            throw "Inno Setup version mismatch: requested $expected, Chocolatey reports '$packageVersion'."
          }

          # 2. Resolve the compiler. The Inno Setup 6 install directory is
          #    preferred over PATH, because a PATH entry may be a Chocolatey shim
          #    rather than the compiler itself.
          $candidates = @()
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if ($programFilesX86) { $candidates += Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe' }
          $candidates += Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) { $candidates += $command.Source }
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup $expected was requested, but ISCC.exe was not found on this runner."
          }

          # 3. ISCC.exe cannot report its own version: its VERSIONINFO resource is
          #    deliberately 0.0.0.0 and Inno Setup 6.7.1 has no `--version`
          #    option. The version that actually built the artifact is asserted
          #    from ISCC's own compiler-engine banner immediately after the build,
          #    before anything is uploaded.
          Write-Host "Inno Setup compiler: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, package and verify the standalone Editor
        shell: pwsh
        run: |
          uv run --group package --group desktop python tools/package_editor.py all *>&1 | Tee-Object -FilePath packaging.log

      - name: Verify the compiler engine version ISCC reported
        shell: pwsh
        run: |
          $expected = $env:INNO_SETUP_VERSION

          # ISCC prints "Compiler engine version: <title> <version>" when it
          # compiles, so the packaging log records the version of the compiler
          # engine that actually built this installer.
          $line = (Select-String -Path packaging.log -Pattern 'Compiler engine version:' |
            Select-Object -First 1).Line
          if (-not $line) {
            throw "ISCC did not report a 'Compiler engine version:' line while building the installer."
          }
          Write-Host "ISCC reported: $line"
          $detected = [regex]::Match($line, '\d+(\.\d+)+').Value
          if ($detected -ne $expected) {
            throw "Inno Setup version mismatch: expected $expected, ISCC reported '$detected'."
          }
          Write-Host "Inno Setup $detected was the compiler engine that built this installer."

      - name: Write artifact checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/editor/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" |
              Set-Content -Path "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-windows-log
          path: |
            packaging.log
            build/editor-package/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Windows desktop verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-windows-desktop-evidence
          path: |
            build/editor-package/verify/reports/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Windows Editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepplant-editor-windows
          path: |
            dist/editor/*.exe
            dist/editor/*.exe.sha256
          retention-days: 14
          if-no-files-found: error


  editor-package-linux:
    # Native Linux distribution gate (Issue #85/#93): the AppImage is built and
    # verified on Linux. The product is a native desktop application, so the
    # evidence is the real GUI: the packaging driver's desktop self-check runs
    # inside `verify`, and an explicit window-discovery step below proves a real
    # X11 window appears and closes on a virtual display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack for the pinned frontend package manager
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the display and Qt WebEngine runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          # Qt WebEngine is Chromium: it needs its usual X11/Graphical libraries,
          # and the GUI needs a display. These are *test/CI* environment
          # dependencies, not something the end user has to install - the
          # application carries its own Qt (Issue #93).
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-utils openbox \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcursor1 \
            libxi6 libxrender1 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxshmfence1 libgbm1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          # Ubuntu renamed the ALSA runtime package; accept either name.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Start a virtual display for the desktop verification
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1600x1000x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if xdpyinfo -display :99 > /dev/null 2>&1; then break; fi
            sleep 1
          done
          # A window manager is part of a normal desktop: without one, X clients
          # that ask to be closed through the EWMH protocol (which is what
          # `xdotool windowclose` sends) have nobody to deliver the request.
          # openbox makes the virtual display behave like an ordinary session, so
          # the window-close assertion below tests the real application behaviour.
          openbox --sm-disable > "$RUNNER_TEMP/openbox.log" 2>&1 &
          for _ in $(seq 1 30); do
            if xdotool search --class openbox > /dev/null 2>&1 \
              || xprop -root _NET_SUPPORTING_WM_CHECK > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "window manager: $(xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null || echo 'not reported')"

      - name: Install build dependencies
        run: uv sync --group package --group desktop

      - name: Read the pinned packaging toolchain
        run: python tools/packaging_toolchain.py export

      - name: Install pinned, integrity-verified appimagetool and AppImage runtime
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          runtime="$RUNNER_TEMP/appimage-runtime"

          # Immutable upstream artifacts, declared in
          # packaging/toolchain.toml. The digest is checked before either file
          # is made executable, so a mismatch aborts the job here and no
          # artifact can be produced with an unexpected toolchain.
          curl -fsSL -o "$tool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum --check -

          curl -fsSL -o "$runtime" "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGE_RUNTIME_SHA256  $runtime" | sha256sum --check -

          chmod +x "$tool" "$runtime"

          echo "appimagetool release:             $APPIMAGETOOL_VERSION"
          echo "appimagetool sha256 verified:     $APPIMAGETOOL_SHA256"
          echo "AppImage runtime release:         $APPIMAGE_RUNTIME_VERSION"
          echo "AppImage runtime sha256 verified: $APPIMAGE_RUNTIME_SHA256"
          "$tool" --version

          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Build, package and verify the standalone desktop Editor
        run: |
          uv run --group package --group desktop python tools/package_editor.py all 2>&1 | tee packaging.log

      - name: Write artifact checksum
        run: |
          cd dist/editor
          for artifact in *.AppImage; do
            sha256sum "$artifact" > "$artifact.sha256"
          done

      - name: Discover the real packaged window on the virtual display
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editor-window"
          launcher="$(uv run --group package --group desktop python tools/package_editor.py extract \
            --extract-to "$RUNNER_TEMP/editor-window/install" | tail -n 1)"
          echo "packaged launcher: $launcher"
          test -x "$launcher"

          # Launch exactly as an end user does: with NO model argument. This must
          # open a graphical window, never demand a path or print help.
          "$launcher" > "$RUNNER_TEMP/editor-window/app.log" 2>&1 &
          app_pid=$!

          found=0
          for _ in $(seq 1 90); do
            if xdotool search --name "DeepPlant Editor" > /dev/null 2>&1; then
              found=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$found" -ne 1 ]; then
            echo "FAILED: no DeepPlant Editor window appeared on the virtual display"
            cat "$RUNNER_TEMP/editor-window/app.log" || true
            kill "$app_pid" 2>/dev/null || true
            exit 1
          fi

          echo "window(s) discovered:"
          for wid in $(xdotool search --name "DeepPlant Editor"); do
            echo "  $wid  $(xdotool getwindowname "$wid")"
          done

          # Prove the application exits when its window is closed, using only real
          # user-level close paths (never a signal and never a kill): first the
          # window-manager close request, then, if the session does not act on it,
          # the standard keyboard close gesture.
          wait_for_exit() {
            local deadline=$1
            for _ in $(seq 1 "$deadline"); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          close_windows() {
            for wid in $(xdotool search --name "DeepPlant Editor"); do
              xdotool windowclose "$wid" || true
            done
          }

          close_windows
          if ! wait_for_exit 30; then
            echo "the window manager did not close the window; trying the keyboard"
            echo "close gesture instead"
            for wid in $(xdotool search --name "DeepPlant Editor"); do
              xdotool windowactivate --sync "$wid" 2>/dev/null || true
              xdotool key --window "$wid" --clearmodifiers alt+F4 || true
            done
          fi

          if ! wait_for_exit 30; then
            echo "FAILED: the application did not exit after its window was closed"
            cat "$RUNNER_TEMP/editor-window/app.log" || true
            kill "$app_pid" 2>/dev/null || true
            exit 1
          fi

          echo "WINDOW LIFECYCLE VERIFIED: the packaged application opened a real"
          echo "window with no model argument and exited when it was closed."

      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-linux-log
          path: |
            packaging.log
            build/editor-package/**/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the Linux desktop verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-package-linux-desktop-evidence
          path: |
            build/editor-package/verify/reports/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Linux Editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepplant-editor-linux
          path: |
            dist/editor/*.AppImage
            dist/editor/*.AppImage.sha256
          retention-days: 14
          if-no-files-found: error

