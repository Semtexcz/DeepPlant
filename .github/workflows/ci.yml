name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  require-pr-for-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require main commits to come from a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          count="$(python -c 'import json, sys; print(len(json.load(sys.stdin)))' <<< "${response}")"
          if [ "${count}" -eq 0 ]; then
            echo "Pushes to main must come from a GitHub pull request. Create a branch, push it, and open a ready PR instead."
            exit 1
          fi


  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies

        run: make setup

      - name: Check
        run: make check

