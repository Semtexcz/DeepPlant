<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">DeepPlant master icon</title>
  <desc id="desc">Stylized D formed by a process piping network with four red nodes.</desc>

  <!-- DeepPlant brand colors:
       red   #F11E1E
       black #000000
       white #FFFFFF
  -->

  <g id="pipes"
     fill="none"
     stroke="#000000"
     stroke-width="46"
     stroke-linecap="butt"
     stroke-linejoin="round">

    <!-- Outer upper branch: runs through the right junction center -->
    <path d="M 142 104
             H 300
             C 372 104 408 150 408 266" />

    <!-- Outer lower branch: runs through the right junction center -->
    <path d="M 142 408
             H 300
             C 372 408 408 362 408 266" />

    <!-- Inner upper-left branch -->
    <path d="M 142 104
             V 212
             C 142 246 164 266 198 266
             H 268" />

    <!-- Inner lower-left branch -->
    <path d="M 142 408
             H 218
             C 250 408 268 388 268 356
             V 266" />

    <!-- Center-right branch -->
    <path d="M 268 266 H 408" />
  </g>

  <!-- Junction / graph nodes -->
  <g id="nodes"
     fill="#F11E1E"
     stroke="#FFFFFF"
     stroke-width="10">
    <circle cx="142" cy="104" r="34" />
    <circle cx="268" cy="266" r="34" />
    <circle cx="408" cy="266" r="34" />
    <circle cx="142" cy="408" r="34" />
  </g>
</svg>
